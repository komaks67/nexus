# 開発用の周辺サービス一式（本番では R2 / マネージドDB 等に置き換え可能）
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      retries: 10

  redis:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]

  meilisearch:
    image: getmeili/meilisearch:v1.15
    environment:
      MEILI_MASTER_KEY: dev-master-key-change-me-0123456789
      MEILI_ENV: development
    ports: ["7700:7700"]
    volumes: [meili:/meili_data]

  # Cloudflare R2 の代わりにローカルで使う S3 互換ストレージ
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  # バケット作成と CORS 設定（ブラウザから直接アップロードするため ETag を公開）
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/nexus-files;
      exit 0;
      "

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

volumes:
  pgdata:
  meili:
  minio:
