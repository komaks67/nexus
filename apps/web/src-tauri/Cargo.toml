[package]
name = "nexus-desktop"
version = "0.3.0"
description = "Nexus - 次世代コミュニケーションプラットフォーム（デスクトップ版）"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 配布サイズを小さく・起動を速くする設定
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
